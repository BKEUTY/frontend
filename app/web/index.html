<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/logo_nontext.svg" />
    <link rel="alternate icon" href="/logo_nontext.svg" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#c2185b" />
    <meta name="description" content="BKEUTY - Your Beauty Destination" />
    <link rel="apple-touch-icon" href="/logo_nontext.svg" />
    <link rel="manifest" href="/manifest.json" />

    <title>BKEUTY</title>

    <!-- DNS prefetch for API endpoints -->
    <link rel="dns-prefetch" href="https://bkeuty.vercel.app" />

    <!-- Google Fonts Preconnect and Link -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Critical CSS: Inline above-the-fold styles to prevent render-blocking -->
    <style>
        /* Critical path CSS - inlined for instant first paint */
        *,*::before,*::after{box-sizing:border-box}
        body{margin:0;padding:0;font-family:'Be Vietnam Pro',sans-serif;font-size:16px;font-weight:400;background-color:#fdf2f8;color:#1e293b;line-height:1.6;-webkit-font-smoothing:antialiased}
        #root{display:flex;flex-direction:column;min-height:100vh}
        .App{display:flex;flex-direction:column;min-height:100vh}
        .main_content{flex:1;padding-top:70px;min-height:calc(100vh - 300px)}
        .layout_fallback{padding:40px;max-width:1200px;margin:0 auto}
        /* Critical header skeleton */
        .ant-layout-header{line-height:normal}
    </style>
</head>

<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
</body>

</html>
