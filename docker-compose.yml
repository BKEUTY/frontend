services:
  # User Storefront Application
  user-frontend:
    build:
      context: ./app/web
      dockerfile: Dockerfile.dev
    container_name: bkeuty-user
    ports:
      - "3000:3000"
    volumes:
      - ./app/web:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    restart: always

  # Administrative Management Portal
  admin-frontend:
    build:
      context: ../admin/app/web
      dockerfile: Dockerfile.dev
    container_name: bkeuty-admin
    ports:
      - "3100:3100"
    volumes:
      - ../admin/app/web:/app
      - /app/node_modules
    environment:
      - PORT=3100
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    restart: always

networks:
  default:
    name: bkeuty-network
